spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MYSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false   # 테스트는 H2 사용 → MySQL 전용 마이그레이션 미적용, Hibernate가 스키마 생성

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  mail:
    host: smtp.gmail.com
    port: 587
    username: root
    password: 1111
    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          starttls:
            enable: true
    max_attempts: 5
    lock_minutes: 15
    expire_minutes: 5
    cooldown_seconds: 60
    done_minutes: 10

jasypt:
  encryptor:
    password: test_password
    bean: jasyptEncryptor

jwt:
  secret: jwt_key
  expiration_time: 600000
  refresh_expiration_time: 1209600000

app:
  limits:
    keyword-max-count: 3
    keyword-subscriber-max-count: 10
    folder-max-count: 3
    folder-subscriber-max-count: 20

cors:
  allowed-origins: http://localhost:3000
